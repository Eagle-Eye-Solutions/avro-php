name: PHPCS Diff

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpcs-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.2'
          tools: composer:2.9.8
          coverage: none

      # phpcs is a static analyser and reads no project autoloading, so the
      # project's own dependencies are never installed here.
      - name: Cache phpcs-diff install
        id: phpcs-diff-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer
          key: phpcs-diff-2.0.1-php-8.2-${{ runner.os }}

      - name: Install phpcs-diff
        if: steps.phpcs-diff-cache.outputs.cache-hit != 'true'
        run: composer global require olivertappin/phpcs-diff:2.0.1 --no-interaction --no-progress

      - name: Run phpcs-diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          "$(composer global config bin-dir --absolute)/phpcs-diff" "$BASE_REF"
